<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이도형 · 배포 인덱스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',sans-serif;background:#0E0E12;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vw;}
.wrap{max-width:720px;width:100%;}
.kicker{color:#E8344E;font-weight:800;letter-spacing:.04em;font-size:15px;}
h1{font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:-.02em;margin:14px 0 8px;line-height:1.15;}
.sub{color:#9A9AA6;font-size:16px;margin-bottom:40px;}
.list{display:flex;flex-direction:column;gap:14px;}
a.card{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;background:#17171C;border:1px solid #2A2A33;border-radius:16px;padding:22px 24px;transition:.18s;}
a.card:hover{border-color:#E8344E;transform:translateX(4px);}
a.card .t{font-size:18px;font-weight:800;color:#fff;}
a.card .d{font-size:14px;color:#9A9AA6;margin-top:4px;}
a.card .arrow{color:#E8344E;font-size:22px;font-weight:900;flex:none;}
.foot{margin-top:40px;color:#5B5B66;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">DEPLOYMENTS</div>
  <h1>이도형 · 배포 인덱스</h1>
  <p class="sub">발표 덱 · 웹툴 모음</p>
  <div class="list">
    <a class="card" href="./sparta-growth-deck/">
      <div>
        <div class="t">스파르타클럽 그로스 마케터 면접덱</div>
        <div class="d">Writing → Reviewing · AI 코드 검수 전문가 양성 전략 (13p)</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
  <p class="foot">hound600al.github.io · GitHub Pages</p>
</div>
</body>
</html>
