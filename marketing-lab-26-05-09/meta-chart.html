<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta 광고 성과 추이</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 20px; }
  .channel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px 16px; background: #EFF4FF; border-left: 4px solid #1877F2; border-radius: 0 8px 8px 0; }
  .channel-logo { width: 36px; height: 36px; background: #1877F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0; }
  .channel-name { font-size: 15px; font-weight: 600; color: #1877F2; }
  .channel-period { font-size: 11px; color: #666; margin-top: 2px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .card { background: #f5f5f3; border-radius: 8px; padding: 12px 14px; }
  .card-label { font-size: 11px; color: #6b6b6b; margin-bottom: 3px; }
  .card-value { font-size: 20px; font-weight: 500; }
  .card-sub { font-size: 10px; color: #999; margin-top: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; font-size: 11px; color: #6b6b6b; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .sw-bar  { width: 11px; height: 11px; border-radius: 2px; background: #85B7EB; display: inline-block; }
  .sw-line { width: 14px; height: 0; border-top: 2.5px solid #1D9E75; display: inline-block; }
  .sw-dash { width: 14px; height: 0; border-top: 2.5px dashed #D85A30; display: inline-block; }
  .sw-dot  { width: 14px; height: 0; border-top: 2px dotted #7C3AED; display: inline-block; }
  .sw-ev   { width: 1.5px; height: 13px; background: rgba(136,135,128,0.6); display: inline-block; }
  .leg-sep { width: 0.5px; height: 13px; background: #ddd; margin: 0 3px; display: inline-block; }
  .chart-wrap { position: relative; width: 100%; height: 320px; }
  @media (max-width: 600px) { .cards { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>
<div class="channel-header">
  <div class="channel-logo">f</div>
  <div>
    <div class="channel-name">Meta 광고 월별 성과 추이</div>
    <div class="channel-period">2024.06 ~ 2026.04 · 상대 지수(기준=100)</div>
  </div>
</div>
<div class="cards">
  <div class="card"><div class="card-label">구매 CPA 최저점</div><div class="card-value">지수 12</div><div class="card-sub">2026-04 (기준=100)</div></div>
  <div class="card"><div class="card-label">회원가입 최고점</div><div class="card-value">지수 3,075</div><div class="card-sub">2026-03 (기준=100)</div></div>
  <div class="card"><div class="card-label">구매 최고점</div><div class="card-value">지수 2,773</div><div class="card-sub">2026-04 (기준=100)</div></div>
  <div class="card"><div class="card-label">구매 CPA 최저점</div><div class="card-value">지수 12</div><div class="card-sub">2026-04 (기준=100)</div></div>
</div>
<div class="legend">
  <span class="legend-item"><span class="sw-bar"></span>광고비 지수 (왼쪽 축)</span>
  <span class="legend-item"><span class="sw-line"></span>회원가입 지수 (오른쪽 축)</span>
  <span class="legend-item"><span class="sw-dash"></span>구매 지수 (오른쪽 축)</span>
  <span class="legend-item"><span class="sw-dot"></span>구매 CPA 지수 (툴팁 확인)</span>
  <span class="leg-sep"></span>
  <span class="legend-item"><span class="sw-ev"></span>주요 이벤트</span>
</div>
<div class="chart-wrap">
  <canvas id="mc" role="img" aria-label="메타 광고 월별 성과 추이 상대 지수, 2024.06~2026.04"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const rows=[
  {m:'24-06',s:100,r:100,p:4.7,c:null},
  {m:'24-07',s:135,r:739.7,p:41.2,c:100},
  {m:'24-08',s:144.5,r:620.8,p:37.5,c:117.5},
  {m:'24-09',s:124.4,r:502.3,p:33,c:115},
  {m:'24-10',s:134.2,r:500.5,p:27.5,c:148.8},
  {m:'24-11',s:165.7,r:831.3,p:81.7,c:61.9},
  {m:'24-12',s:157.3,r:591.8,p:141.7,c:33.8},
  {m:'25-01',s:126.7,r:661.2,p:227,c:17},
  {m:'25-02',s:125.3,r:517.5,p:191.3,c:20},
  {m:'25-03',s:227.4,r:1074.5,p:430.3,c:16.1},
  {m:'25-04',s:349.1,r:1284.8,p:632.7,c:16.8},
  {m:'25-05',s:372.4,r:1483,p:663,c:17.1},
  {m:'25-06',s:391,r:1375.5,p:623.2,c:19.1},
  {m:'25-07',s:507.4,r:1665.7,p:1097.3,c:14.1},
  {m:'25-08',s:414.6,r:1445.2,p:810.8,c:15.6},
  {m:'25-09',s:353,r:1055.5,p:690.7,c:15.6},
  {m:'25-10',s:586.2,r:1419.8,p:701,c:25.5},
  {m:'25-11',s:497.5,r:1178.7,p:1229.7,c:12.3},
  {m:'25-12',s:871,r:1610.2,p:1495.7,c:17.8},
  {m:'26-01',s:635.8,r:934.3,p:528.7,c:36.7},
  {m:'26-02',s:827.9,r:2335.2,p:1372.7,c:18.4},
  {m:'26-03',s:1259.8,r:3075.3,p:2276.7,c:16.9},
  {m:'26-04',s:1103.3,r:2506.5,p:2772.8,c:12.1},
];
const annos={5:'MMP 도입',7:'구글·틱톡 확장'};
const vLinePlugin={id:'vl',afterDraw(chart){const{ctx,chartArea:ca,scales}=chart;Object.entries(annos).forEach(([i,lbl])=>{const x=scales.x.getPixelForValue(+i);ctx.save();ctx.strokeStyle='rgba(136,135,128,0.45)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x,ca.top+20);ctx.lineTo(x,ca.bottom);ctx.stroke();ctx.font='10px sans-serif';ctx.fillStyle='rgba(100,100,100,0.85)';ctx.textAlign='center';ctx.fillText(lbl,x,ca.top+13);ctx.restore();});}};
new Chart(document.getElementById('mc'),{
  plugins:[vLinePlugin],
  data:{labels:rows.map(r=>r.m),datasets:[
    {type:'bar',label:'광고비 지수',data:rows.map(r=>r.s),backgroundColor:'#85B7EB',yAxisID:'yL',order:3,borderRadius:2},
    {type:'line',label:'회원가입 지수',data:rows.map(r=>r.r),borderColor:'#1D9E75',backgroundColor:'transparent',borderWidth:2.5,pointRadius:3,pointBackgroundColor:'#1D9E75',yAxisID:'yR',order:2,tension:0.3,spanGaps:false},
    {type:'line',label:'구매 지수',data:rows.map(r=>r.p),borderColor:'#D85A30',backgroundColor:'transparent',borderWidth:2.5,borderDash:[6,3],pointRadius:3,pointBackgroundColor:'#D85A30',yAxisID:'yR',order:2,tension:0.3,spanGaps:false},
    {type:'line',label:'구매 CPA 지수',data:rows.map(r=>r.c),borderColor:'#7C3AED',backgroundColor:'transparent',borderWidth:2,borderDash:[2,2],pointRadius:2.5,pointBackgroundColor:'#7C3AED',yAxisID:'yCPA',order:1,tension:0.2,spanGaps:false}
  ]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(255,255,255,0.97)',borderColor:'rgba(0,0,0,0.08)',borderWidth:1,titleColor:'#1a1a1a',bodyColor:'#444',padding:10,
      callbacks:{title(i){return i[0].label;},label(ctx){const v=ctx.parsed.y;if(v===null||v===undefined)return null;
        if(ctx.dataset.label==='광고비 지수')return '광고비 지수: '+v.toLocaleString();
        if(ctx.dataset.label==='회원가입 지수')return '회원가입 지수: '+v.toLocaleString();
        if(ctx.dataset.label==='구매 지수')return '구매 지수: '+v.toLocaleString();
        return '구매CPA 지수: '+v.toLocaleString();}}}},
    scales:{
      x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:45,font:{size:9},color:'#888'}},
      yL:{type:'linear',position:'left',title:{display:true,text:'광고비 지수 (기준=100)',font:{size:10},color:'#999'},ticks:{callback:v=>v.toLocaleString(),font:{size:9},color:'#888'},grid:{color:'rgba(0,0,0,0.05)'}},
      yR:{type:'linear',position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'회원가입·구매 지수 (기준=100)',font:{size:10},color:'#999'},ticks:{callback:v=>v.toLocaleString(),font:{size:9},color:'#888'}},
      yCPA:{type:'linear',position:'right',display:false}
    }
  }
});
</script>
</body>
</html>
